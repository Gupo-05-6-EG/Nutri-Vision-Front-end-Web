name: CI

on:
  push:
    branches: [main, dev]
  # Sem filtro de branch: PRs empilhados (base numa feature branch) tambem
  # precisam de CI, e com o filtro eles ficavam sem nenhum check.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Formatacao (prettier)
        run: npm run format:check
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build de producao
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_APP_NAME: Nutri Vision
          VITE_ENVIRONMENT: production
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: painel-web-dist
          path: dist
          retention-days: 7

  test:
    name: Testes de componentes (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: vitest com cobertura
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    name: E2E do fluxo principal (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instala o Chromium
        run: npx playwright install --with-deps chromium
      - name: playwright test
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
