name: CI

on:
  push:
    branches: [main, develop]
  # Sem filtro de branch: PRs empilhados (base numa feature branch) tambem
  # precisam de CI, e com o filtro eles ficavam sem nenhum check.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Formatacao (prettier)
        run: npm run format:check
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build de producao
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_APP_NAME: Nutri Vision
          VITE_ENVIRONMENT: production
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: painel-web-dist
          path: dist
          retention-days: 7
